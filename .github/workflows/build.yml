name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            engine_arch: arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            engine_arch: x86_64
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # The macOS bundle ships the Colima + Lima engine via bundle.resources
      # (tauri.macos.conf.json), so the build fails without it. Same steps as
      # release.yml, minus Developer ID signing (fetch-engine ad-hoc signs).
      - name: Check engine lock is in sync (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/lock-engine.sh --check
        shell: bash

      - name: Fetch container engine (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/fetch-engine.sh ${{ matrix.engine_arch }}
        shell: bash

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@8dc56df183cc5aa67c880b1931659f6bc9af997a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
