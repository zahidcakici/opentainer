[package]
name = "opentainer"
version = "0.2.0"
description = "A modern, high-performance desktop container management application."
authors = ["Zahid Cakici"]
edition = "2021"
rust-version = "1.92.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "opentainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
futures-util = { version = "0.3", features = ["sink"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
bollard = "0.21.1"
tauri-plugin-opener = "2.7.2"
# `zip` is off: it only unpacks zipped Windows installers / gzipped AppImages,
# and we ship raw .exe/.msi/.AppImage update bundles. macOS .app.tar.gz
# extraction doesn't depend on it. Also drops the vulnerable zip 4.x
# (RUSTSEC-2026-0367/0368/0369) until the plugin moves to zip >= 9.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }

# Optimize for fast rebuilds during development
[profile.dev]
incremental = true

# Optimize for smaller binary size in release builds
[profile.release]
lto = "thin"          # Link-time optimization (good balance)
opt-level = "s"       # Optimize for size while keeping good performance
strip = "symbols"     # Remove debug symbols (~30-50% smaller)
codegen-units = 1     # Better optimization (slower compile, worth it for release)
panic = "abort"       # ~10% smaller, no stack unwinding
